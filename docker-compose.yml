services:
  # ── Service 1 : Data API (aucun port exposé) ─────────────────────────────
  data-api:
    build:
      context: .
      dockerfile: docker/data_api.Dockerfile
    image: horragor-data-api:1.0
    container_name: horragor-data
    pull_policy: never
    env_file: .env.docker
    # ❌ PAS DE 'ports:' ici → invisible depuis le PC hôte
    networks:
      - horragor-net
    restart: unless-stopped

  # ── Service 2 : Intelligence API (aucun port exposé) ─────────────────────
  intelligence-api:
    build:
      context: .
      dockerfile: docker/intelligence_api.Dockerfile
    image: horragor-intelligence-api:1.0
    container_name: horragor-ia
    pull_policy: never
    env_file: .env.docker
    # ❌ PAS DE 'ports:' ici → invisible depuis le PC hôte
    networks:
      - horragor-net
    depends_on:
      - data-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    # 🔒 NOUVEAU : montage du certificat TLS (stratégie B, read-only)
    # ./certs (ton PC) → /app/certs (conteneur), chemin utilisé par le Dockerfile
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped

  # ── Service 3 : Frontend Streamlit (seul point d'entrée) ─────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: horragor-frontend:latest
    container_name: horragor-front
    pull_policy: never
    # ✅ SEUL PORT EXPOSE vers l'extérieur
    env_file:
      - .env.docker 
    ports:
      - "8501:8501"
    networks:
      - horragor-net
    depends_on:
      - intelligence-api
    environment:
      # 🔒 MODIFIÉ : https:// car l'API Intelligence est maintenant en TLS
      - API_BASE_URL=https://horragor-ia:8000
      - SSL_CERT_PATH=/app/certs/cert.pem
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped

  # ── Service 4 : Prometheus (métriques data-api + intelligence-api) ───────
  prometheus:
    image: prom/prometheus:latest
    container_name: horragor-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9092:9090"
    networks:
      - horragor-net
    depends_on:
      - data-api
      - intelligence-api
    restart: unless-stopped

  # ── Service 5 : Grafana (dashboards à partir de Prometheus) ───────────────
  grafana:
    image: grafana/grafana:latest
    container_name: horragor-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    networks:
      - horragor-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Service 6 : Uptime Kuma (surveillance des 3 services) ────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: horragor-uptime-kuma
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3003:3001"
    networks:
      - horragor-net
    depends_on:
      - data-api
      - intelligence-api
      - frontend
    restart: unless-stopped

networks:
  horragor-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  uptime_kuma_data: