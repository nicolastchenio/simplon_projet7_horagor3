name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JWT_SECRET_KEY: ci_test_secret_key
      AUTH_PASSWORD_HASH: ci_test_password_hash_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - run: uv run genbadge coverage -i coverage.xml -o coverage.svg
      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add coverage.svg
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git diff --staged --quiet || git push

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/data_api.Dockerfile -t horragor-data-api:ci .
      - run: docker build -f docker/intelligence_api.Dockerfile -t horragor-intelligence-api:ci .
      - run: docker build -f docker/frontend.Dockerfile -t horragor-frontend:ci .
